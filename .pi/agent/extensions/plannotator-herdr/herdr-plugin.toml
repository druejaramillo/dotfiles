id = "local.plannotator-herdr"
name = "Plannotator Browser Relay"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Advertise a selectable Plannotator renderer; open only reviews routed to this terminal-browser client"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "plannotator-relay.ts", "start"]

[[actions]]
id = "start"
title = "Start Plannotator browser relay"
contexts = ["global"]
command = ["node", "plannotator-relay.ts", "start"]

[[actions]]
id = "status"
title = "Plannotator browser relay status"
contexts = ["global"]
command = ["node", "plannotator-relay.ts", "status"]

[[panes]]
id = "browser"
title = "Plannotator"
placement = "tab"
command = ["node", "plannotator-browser-tab.ts"]
