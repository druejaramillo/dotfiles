# Control your input devices
# See https://wiki.hypr.land/Configuring/Basics/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu

  # Use a specific keyboard variant if needed (e.g. intl for international keyboards)
  # kb_variant = intl

  kb_layout = us
  # kb_options = caps:escape_shifted_capslock # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 250

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  # sensitivity = 0.35

  # Turn off mouse acceleration (default: adaptive)
  # accel_profile = flat

  # Detach cursor focus from keyboard focus
  # Clicking on a window will move keyboard focus to that window
  mouse_refocus = false
  follow_mouse = 2

  # Use natural (inverse) scrolling
  natural_scroll = true

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4

    # disable tap to click (accidental plam touches)
    tap-to-click = false

    # Enable the touchpad while typing
    # disable_while_typing = false

    # Left-click-and-drag with three fingers
    # drag_3fg = 1
  }
}

# Remap capslock to escape (unless shifted) on laptop keyboard
device {
  name = at-translated-set-2-keyboard
  kb_options = caps:escape_shifted_capslock
}
# Remap capslock to escape (unless shifted) on Denon's keyboard
device {
  name = corsair-corsair-k70-rgb-mk.2-low-profile-mechanical-gaming-keyboard
  kb_options = caps:escape_shifted_capslock
}
# Don't remap capslock on Advantage 360 Pro keyboard
device {
  name = adv360-pro-keyboard
  kb_options = caps
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

# Enable touchpad gestures for changing workspaces
# See https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/
gesture = 3, horizontal, workspace

# Enable touchpad gestures for moving focus (helpful on scrolling layout)
# gesture = 3, left,  dispatcher, movefocus, l
# gesture = 3, right, dispatcher, movefocus, r
